<body>
<header><h1>Spaans <span>leren</span></h1><nav id="nav"></nav></header>
<main id="app"></main>
<script>
// <core>
// ---------- Kernlogica (zonder scherm, getest in Node) ----------
const SOORTEN = ['zelfstandig naamwoord', 'bijvoeglijk naamwoord', 'werkwoord', 'bijwoord', 'voornaamwoord', 'voorzetsel', 'voegwoord', 'telwoord', 'vraag', 'uitdrukking', 'tussenwerpsel', 'zin'];
const GENERA = ['', 'm', 'v', 'm/v'];
const WORD_FIELDS = ['spaans', 'lidwoord', 'nederlands', 'soort', 'genus', 'meervoud', 'thema', 'hoofdstuk', 'les', 'opmerking'];
const VERB_FORMS = ['yo', 'tú', 'él/ella', 'nosotros', 'vosotros', 'ellos/ustedes'];
const VERB_FIELDS = ['infinitief', 'nederlands', 'groep', 'type'].concat(VERB_FORMS, ['opmerking']);

function stripBOM(t) { return t.charCodeAt(0) === 0xFEFF ? t.slice(1) : t; }

function detectDelimiter(text) {
  const first = text.split('\n')[0] || '';
  const counts = { ';': 0, ',': 0, '\t': 0 };
  for (const c of first) if (c in counts) counts[c]++;
  let best = ';', max = -1;
  for (const d of [';', ',', '\t']) if (counts[d] > max) { max = counts[d]; best = d; }
  return best;
}

function parseCSV(text, delim) {
  const rows = []; let row = [], f = '', q = false, i = 0; const n = text.length;
  while (i < n) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i += 2; continue; } q = false; i++; continue; }
      f += c; i++; continue;
    }
    if (c === '"' && f === '') { q = true; i++; continue; }
    if (c === delim) { row.push(f); f = ''; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; i++; continue; }
    f += c; i++;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}

// Leest tekst, bepaalt scheidingsteken en soort bestand, geeft records terug.
function readTable(text) {
  text = stripBOM(text);
  const delim = detectDelimiter(text);
  const rows = parseCSV(text, delim);
  if (rows.length < 2) return { kind: null, error: 'Het bestand bevat geen gegevensregels.' };
  const head = rows[0].map(h => h.trim().toLowerCase());
  let kind = null;
  if (head.includes('spaans') && head.includes('nederlands')) kind = 'woorden';
  else if (head.includes('infinitief')) kind = 'werkwoorden';
  if (!kind) return { kind: null, error: 'Kolomkoppen niet herkend. Verwacht: spaans en nederlands (woorden) of infinitief (werkwoorden).' };
  const records = rows.slice(1).map((r, i) => {
    const o = { __regel: i + 2 };
    head.forEach((h, k) => { o[h] = (r[k] || '').trim(); });
    return o;
  });
  return { kind, records, delim, head };
}

function normKey(s) {
  return (s || '').toLowerCase().normalize('NFC').replace(/[¿¡?!.,…]/g, '').replace(/\s+/g, ' ').trim();
}
function nlTokens(s) {
  return (s || '').toLowerCase().replace(/\([^)]*\)/g, ' ').split(/[,\/;]/)
    .map(x => x.trim().replace(/^(de|het|een)\s+/, '')).filter(Boolean);
}
function nlOverlap(a, b) {
  const A = nlTokens(a), B = nlTokens(b);
  if (!A.length || !B.length) return true;
  const set = new Set(A);
  return B.some(t => set.has(t));
}
function lesPos(w) { return (w.hoofdstuk || 0) * 1000 + (w.les || 0); }

function cleanWord(rec) {
  const f = k => (rec[k] || '').trim();
  let hoofdstuk = parseInt(f('hoofdstuk'), 10) || 0;
  let les = parseInt(f('les'), 10) || 0;
  if (!hoofdstuk && /^\d+\.\d+$/.test(f('les'))) { const p = f('les').split('.'); hoofdstuk = +p[0]; les = +p[1]; }
  const w = {
    id: parseInt(f('id'), 10) || null,
    spaans: f('spaans'), lidwoord: f('lidwoord').toLowerCase(), nederlands: f('nederlands'),
    soort: f('soort').toLowerCase(), genus: f('genus').toLowerCase(), meervoud: f('meervoud'),
    thema: f('thema').toLowerCase(), hoofdstuk, les, opmerking: f('opmerking')
  };
  const warn = [];
  if (!w.spaans) return { error: 'spaans ontbreekt' };
  if (!w.nederlands) return { error: 'nederlands ontbreekt' };
  if (!w.soort) warn.push('soort ontbreekt');
  else if (!SOORTEN.includes(w.soort)) warn.push("onbekende soort '" + w.soort + "'");
  if (!GENERA.includes(w.genus)) warn.push("onbekend genus '" + w.genus + "'");
  if (w.soort === 'zelfstandig naamwoord' && !w.genus) warn.push('genus ontbreekt bij zelfstandig naamwoord');
  return { w, warn };
}

// Voegt binnenkomende records samen met de bestaande woorden. Wijzigt niets in de invoer.
function mergeWords(existing, records) {
  const list = existing.map(w => Object.assign({}, w, { altIds: (w.altIds || []).slice() }));
  const byId = new Map(), byKey = new Map();
  let maxId = 0;
  const reg = w => {
    byId.set(w.id, w); maxId = Math.max(maxId, w.id);
    w.altIds.forEach(a => { byId.set(a, w); maxId = Math.max(maxId, a); });
    const k = normKey(w.spaans) + '|' + w.soort + '|' + w.genus;
    if (!byKey.has(k)) byKey.set(k, []);
    byKey.get(k).push(w);
  };
  list.forEach(reg);
  const rep = { nieuw: 0, bijgewerkt: 0, samengevoegd: 0, ongewijzigd: 0, overgeslagen: 0, details: [], waarschuwingen: 0 };
  const log = (type, rec, tekst) => rep.details.push({ type, regel: rec.__regel, spaans: rec.spaans || '', tekst });
  for (const rec of records) {
    const c = cleanWord(rec);
    if (c.error) { rep.overgeslagen++; log('overgeslagen', rec, c.error); continue; }
    const inc = c.w;
    if (c.warn.length) { rep.waarschuwingen++; log('waarschuwing', rec, c.warn.join('; ')); }
    let m = null, via = null;
    if (inc.id != null) { m = byId.get(inc.id) || null; if (m) via = (m.id === inc.id) ? 'id' : 'alt'; }
    if (!m) {
      const k = normKey(inc.spaans) + '|' + inc.soort + '|' + inc.genus;
      m = (byKey.get(k) || []).find(x => nlOverlap(x.nederlands, inc.nederlands)) || null;
      if (m) via = 'sleutel';
    }
    if (!m) {
      const nw = Object.assign({}, inc, { altIds: [] });
      if (nw.id == null || byId.has(nw.id)) nw.id = maxId + 1;
      list.push(nw); reg(nw); rep.nieuw++;
      continue;
    }
    const changes = [];
    if (via === 'id') {
      for (const f of WORD_FIELDS) {
        const v = inc[f]; const empty = (v === '' || v === 0);
        if (empty || v === m[f]) continue;
        if (f === 'nederlands' && m.altIds.length) {
          // samengevoegd woord: een vertaling die al in de samengevoegde tekst zit, niet terugzetten
          const have = new Set(nlTokens(m.nederlands));
          if (nlTokens(v).every(t => have.has(t))) continue;
        }
        changes.push(f); m[f] = v;
      }
      if (changes.length) { rep.bijgewerkt++; log('bijgewerkt', rec, 'id ' + m.id + ': ' + changes.join(', ')); }
      else rep.ongewijzigd++;
    } else {
      for (const f of WORD_FIELDS) {
        const v = inc[f];
        if (f === 'nederlands') {
          const have = new Set(nlTokens(m.nederlands));
          if (nlTokens(v).some(t => !have.has(t))) { m.nederlands = m.nederlands + ' / ' + v; changes.push(f); }
        } else if (f === 'hoofdstuk' || f === 'les') {
          // de plaats van het eerste voorkomen blijft (de volgorde van de lijst is de leervolgorde)
        } else if (v !== '' && (m[f] === '' || m[f] == null)) { m[f] = v; changes.push(f); }
      }
      if (inc.hoofdstuk && !m.hoofdstuk) { m.hoofdstuk = inc.hoofdstuk; m.les = inc.les; changes.push('les'); }
      let nieuwAlt = false;
      if (inc.id != null && inc.id !== m.id && !m.altIds.includes(inc.id)) { m.altIds.push(inc.id); byId.set(inc.id, m); nieuwAlt = true; }
      if (via === 'alt' && !nieuwAlt && !changes.length) { rep.ongewijzigd++; }
      else {
        rep.samengevoegd++;
        log('samengevoegd', rec, "samengevoegd met id " + m.id + (changes.length ? ' (aangevuld: ' + changes.join(', ') + ')' : ''));
      }
    }
  }
  list.sort((a, b) => a.id - b.id);
  return { words: list, report: rep };
}

function cleanVerb(rec) {
  const f = k => (rec[k] || '').trim();
  const v = { id: parseInt(f('id'), 10) || null };
  VERB_FIELDS.forEach(k => { v[k] = f(k); });
  if (!v.infinitief) return { error: 'infinitief ontbreekt' };
  if (!v.nederlands) return { error: 'nederlands ontbreekt' };
  const warn = [];
  const empty = VERB_FORMS.filter(k => !v[k]);
  if (empty.length) warn.push('ontbrekende vormen: ' + empty.join(', '));
  return { v, warn };
}

function mergeVerbs(existing, records) {
  const list = existing.map(v => Object.assign({}, v));
  const byId = new Map(), byKey = new Map(); let maxId = 0;
  const reg = v => { byId.set(v.id, v); maxId = Math.max(maxId, v.id); byKey.set(normKey(v.infinitief), v); };
  list.forEach(reg);
  const rep = { nieuw: 0, bijgewerkt: 0, samengevoegd: 0, ongewijzigd: 0, overgeslagen: 0, details: [], waarschuwingen: 0 };
  const log = (type, rec, tekst) => rep.details.push({ type, regel: rec.__regel, spaans: rec.infinitief || '', tekst });
  for (const rec of records) {
    const c = cleanVerb(rec);
    if (c.error) { rep.overgeslagen++; log('overgeslagen', rec, c.error); continue; }
    const inc = c.v;
    if (c.warn.length) { rep.waarschuwingen++; log('waarschuwing', rec, c.warn.join('; ')); }
    let m = inc.id != null ? byId.get(inc.id) : null;
    if (!m) m = byKey.get(normKey(inc.infinitief)) || null;
    if (!m) {
      const nv = Object.assign({}, inc);
      if (nv.id == null || byId.has(nv.id)) nv.id = maxId + 1;
      list.push(nv); reg(nv); rep.nieuw++; continue;
    }
    const changes = [];
    for (const f of VERB_FIELDS) { if (inc[f] !== '' && inc[f] !== m[f]) { changes.push(f); m[f] = inc[f]; } }
    if (changes.length) { rep.bijgewerkt++; log('bijgewerkt', rec, 'id ' + m.id + ': ' + changes.join(', ')); }
    else rep.ongewijzigd++;
  }
  list.sort((a, b) => a.id - b.id);
  return { verbs: list, report: rep };
}

// Lesblokken in leervolgorde (op id). Dezelfde lesnaam die later terugkomt wordt een nieuwe ronde.
function buildBlocks(words) {
  const sorted = words.slice().sort((a, b) => a.id - b.id);
  const blocks = [], seen = {}; let cur = null;
  for (const w of sorted) {
    if (!w.hoofdstuk) { if (cur) { cur.lastId = w.id; cur.count++; } continue; }
    if (cur && cur.h === w.hoofdstuk && cur.l === w.les) { cur.lastId = w.id; cur.count++; continue; }
    const label = w.hoofdstuk + '.' + w.les;
    seen[label] = (seen[label] || 0) + 1;
    cur = { h: w.hoofdstuk, l: w.les, label, round: seen[label], lastId: w.id, count: 1 };
    blocks.push(cur);
  }
  blocks.forEach(b => { b.naam = b.round > 1 ? b.label + ' (ronde ' + b.round + ')' : b.label; });
  return blocks;
}

function selectWords(words, blocks, settings) {
  let list = words;
  if (settings && settings.block != null && blocks[settings.block]) {
    const last = blocks[settings.block].lastId;
    list = list.filter(w => w.id <= last);
  }
  if (settings && settings.soorten && settings.soorten.length) list = list.filter(w => settings.soorten.includes(w.soort));
  return list;
}

// ---------- Flashcards (Leitner, 5 vakken) ----------
// Vak 1 komt meteen terug; vak 2 na 1 dag, vak 3 na 3, vak 4 na 7, vak 5 na 21 dagen.
const BOX_DAYS = [0, 1, 3, 7, 21];
const FC_DEFAULT = { size: 20, newMax: 10, dir: 'both', verbs: true };

// richting 'a' = Spaans -> Nederlands, 'b' = Nederlands -> Spaans
function cardKey(kind, id, dir) { return kind + id + ':' + dir; }

// Begin van de lokale dag + dagen, zodat een kaart van gisteren vanochtend al aan de beurt is.
function dueDate(box, now) {
  const days = BOX_DAYS[box - 1];
  if (!days) return now;
  const d = new Date(now);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + days).getTime();
}

function gradeCard(prev, key, correct, now) {
  const p = prev ? Object.assign({}, prev) : { key, box: 1, seen: 0, correct: 0, wrong: 0 };
  p.key = key;
  p.box = correct ? Math.min(5, (p.box || 1) + 1) : 1;
  p.due = dueDate(p.box, now);

function shuffle(a, rng) {

// Stelt de volgende sessie samen: eerst wat aan de beurt is (zwakste vak eerst), daarna nieuwe kaarten.
// In "beide richtingen" komt Nederlands -> Spaans van een woord pas als Spaans -> Nederlands in vak 2 of hoger zit.
function sessionPlan(cards, progress, fc, now, rng) {
  rng = rng || Math.random;
  const both = !fc.dir || fc.dir === 'both';
  const due = [], later = [], nieuwW = [], nieuwV = [], boxes = [0, 0, 0, 0, 0];
  let learned = 0;
  for (const c of cards) {
    const p = progress.get(c.key);
    if (p) { learned++; boxes[p.box - 1]++; (p.due <= now ? due : later).push(c); continue; }
    if (both && c.dir === 'b') {
      const a = progress.get(cardKey(c.kind, c.id, 'a'));
      if (!a || a.box < 2) continue;
    }
    (c.kind === 'v' ? nieuwV : nieuwW).push(c);
  }
  if (fc.mix) for (const pool of [nieuwW, nieuwV]) {
    // door elkaar: eerst één vorm van elk werkwoord (willekeurige persoon), pas daarna een tweede van hetzelfde werkwoord
    shuffle(pool, rng); const seen = {};
    pool.forEach(x => { x._r = seen[x.id] = (seen[x.id] || 0) + 1; });
    pool.sort((x, y) => x._r - y._r); pool.forEach(x => { delete x._r; });
  }
  else if (fc.mix == null && fc.order !== 'list') { shuffle(nieuwW, rng); shuffle(nieuwV, rng); } // nieuwe kaarten willekeurig, tenzij "in volgorde van je lijst"
  // Aan de beurt: zwakste niveau eerst, binnen een niveau door elkaar (anders krijgen steeds dezelfde kaarten voorrang).
  shuffle(due, rng);
  due.sort((x, y) => progress.get(x.key).box - progress.get(y.key).box);
  const dueTaken = due.slice(0, fc.size);
  const room = Math.max(0, Math.min(fc.newMax, fc.size - dueTaken.length));
  let nv = Math.min(nieuwV.length, Math.max(room >= 2 ? 1 : 0, Math.round(room * 0.2)));
  const nw = Math.min(nieuwW.length, room - nv);
  nv = Math.min(nieuwV.length, room - nw);
  let list = dueTaken.concat(nieuwW.slice(0, nw), nieuwV.slice(0, nv));
  let extra = false;
  if (!list.length && later.length) {
    later.sort((x, y) => progress.get(x.key).due - progress.get(y.key).due);
    list = later.slice(0, fc.size); extra = true;
  }
  shuffle(list, rng);
  return { cards: list, due: dueTaken.length, nieuw: nw + nv, extra, dueTotal: due.length, newTotal: nieuwW.length + nieuwV.length, learned, boxes };
}

function newSession(cards) {
  return { queue: cards.slice(), total: cards.length, answered: 0, juist: 0, fout: 0, missed: [] };
}

// Verwerkt één antwoord. Een fout antwoord komt na ongeveer 3 kaarten terug (herhaling);
// de herhaling telt niet mee in de score en verandert het vak niet nog eens.
function answerSession(sess, progress, correct, now) {
  const card = sess.queue.shift();
  let update = null;
  if (!card.retry) {
    update = gradeCard(progress.get(card.key), card.key, correct, now);
    sess.answered++;
    if (correct) sess.juist++; else { sess.fout++; sess.missed.push(card); }
  }
  if (!correct) sess.queue.splice(Math.min(3, sess.queue.length), 0, Object.assign({}, card, { retry: true }));
  return { update, card };

const BACKUP_DAGEN = 7; // vanaf zoveel dagen zonder back-up verschijnt de herinnering
// Lokale datum als 'JJJJ-MM-DD' (de dag zoals jij hem ervaart, niet UTC).

  return Math.max(0, Math.round((db - da) / 86400000));

}

// ---------- Opslag (IndexedDB, met geheugen als noodoplossing) ----------
const DB_NAME = 'spaans-leren-app-ov1', DB_VER = 1;
const STORE_DEFS = { words: 'id', verbs: 'id', progress: 'key', meta: 'key' };
let db = null, memStore = null, storageNote = '';

function openDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error('IndexedDB is niet beschikbaar'));
    let rq;
    try { rq = indexedDB.open(DB_NAME, DB_VER); } catch (e) { return reject(e); }
    rq.onupgradeneeded = () => { for (const [n, k] of Object.entries(STORE_DEFS)) if (!rq.result.objectStoreNames.contains(n)) rq.result.createObjectStore(n, { keyPath: k }); };
    rq.onsuccess = () => resolve(rq.result);
    rq.onerror = () => reject(rq.error);
    rq.onblocked = () => reject(new Error('opslag geblokkeerd door een ander venster'));
  });
}
const store = {
  async init() {
    try { db = await openDB(); }
    catch (e) {
      memStore = { words: new Map(), verbs: new Map(), progress: new Map(), meta: new Map() };
      storageNote = 'Let op: opslag op dit toestel is niet beschikbaar (' + e.message + '). Je gegevens verdwijnen als je dit venster sluit. Maak een back-up.';
    }
  },
  req(rq) { return new Promise((res, rej) => { rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); },
  async getAll(name) {
    if (memStore) return Array.from(memStore[name].values());
    return this.req(db.transaction(name).objectStore(name).getAll());
  },
  async get(name, key) {
    if (memStore) return memStore[name].get(key);
    return this.req(db.transaction(name).objectStore(name).get(key));
  },
  async put(name, item) {
    if (memStore) { memStore[name].set(item[STORE_DEFS[name]], item); return; }
    return this.req(db.transaction(name, 'readwrite').objectStore(name).put(item));
  },
  // Vervangt meerdere tabellen in één transactie (voor het terugzetten van een back-up).
  async replaceMany(data) {
    const names = Object.keys(data);
    if (memStore) { for (const n of names) memStore[n] = new Map(data[n].map(i => [i[STORE_DEFS[n]], i])); return; }
    return new Promise((res, rej) => {
      const tx = db.transaction(names, 'readwrite');
      for (const n of names) { const os = tx.objectStore(n); os.clear(); data[n].forEach(i => os.put(i)); }
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('afgebroken'));
    });
  },
  // Vervangt de hele inhoud in één transactie: helemaal gelukt of helemaal niet.
  async replaceAll(name, items) {
    if (memStore) { memStore[name] = new Map(items.map(i => [i[STORE_DEFS[name]], i])); return; }
    return new Promise((res, rej) => {
      const tx = db.transaction(name, 'readwrite'), os = tx.objectStore(name);
      os.clear(); items.forEach(i => os.put(i));
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('afgebroken'));
    });
  }
};

    <section class="card dagstand">

      ${(() => { const bs = backupStatus(S.lastBackup, S.progress.size > 0 || S.words.length > 0, Date.now());

}

function viewFlashHome() {
  return `<p><button class="btn ghost small" data-act="nav" data-v="start">← Home</button></p>` + flashStartCard(selectWords(S.words, S.blocks, S.settings));
}

// Werkwoorden doen mee als je niets filtert en "meenemen" aan staat, of als je het soort "werkwoord" aanvinkt.
function verbsOn() {
  const so = S.settings.soorten;
  return so.length ? so.includes('werkwoord') : !!S.settings.fc.verbs;
}
function fcPlan(sel) {
  const fc = S.settings.fc;
  return sessionPlan(buildCards(sel, S.verbs, Object.assign({}, fc, { verbs: verbsOn() })), S.progress, fc, Date.now());
}

function flashStartCard(sel) {
  const fc = S.settings.fc, plan = fcPlan(sel);
  const opt = (v, cur, t) => `<option value="${v}" ${String(cur) === String(v) ? 'selected' : ''}>${t}</option>`;
  const boxes = levelTiles(plan.boxes);
  let info, btn;
  if (!plan.cards.length) { info = 'Er zijn geen kaarten in je selectie.'; btn = 'Start flashcards'; }
  else if (plan.extra) { info = 'Niets is vandaag nog aan de beurt. Je kunt toch oefenen: dan komen de kaarten die het eerst terugkomen.'; btn = 'Toch oefenen (' + plan.cards.length + ' kaarten)'; }
  else { info = `Volgende sessie: <b>${plan.cards.length}</b> kaarten (${plan.due} herhalen, ${plan.nieuw} nieuw).`; btn = 'Start flashcards'; }
  return `<section class="card"><h2>Flashcards</h2>
    <p><b>${plan.dueTotal}</b> aan de beurt · <b>${plan.newTotal}</b> nieuw beschikbaar · <b>${plan.learned}</b> al geoefend</p>
    <p class="hint">Hoe goed ken je je kaarten?</p>
    <div class="boxes">${boxes}</div>
    <p>${info}</p>
    <p><button class="btn" data-act="fc-start" ${plan.cards.length ? '' : 'disabled'}>${btn}</button></p>
    <details><summary>Instellingen flashcards</summary>
      <label class="field">Kaarten per sessie<select id="fc-size">${[10, 20, 30, 50].map(n => opt(n, fc.size, n)).join('')}</select></label>
      <label class="field">Nieuwe kaarten per sessie (maximum)<select id="fc-new">${[5, 10, 15, 20].map(n => opt(n, fc.newMax, n)).join('')}</select></label>
      <label class="field">Nieuwe kaarten kiezen<select id="fc-order">${[['random', 'willekeurig uit je selectie'], ['list', 'in volgorde van je lijst']].map(([v, t]) => opt(v, fc.order || 'random', t)).join('')}</select></label>
      <label class="field">Richting<select id="fc-dir">${opt('both', fc.dir, 'Beide (eerst Spaans → Nederlands, daarna omgekeerd)')}${opt('a', fc.dir, 'Alleen Spaans → Nederlands')}${opt('b', fc.dir, 'Alleen Nederlands → Spaans')}</select></label>
      <label class="field">Werkwoorden meenemen<select id="fc-verbs">${opt('1', fc.verbs ? 1 : 0, 'Ja')}${opt('0', fc.verbs ? 1 : 0, 'Nee')}</select></label>
      <p class="hint">${levelHint}</p>
    </details></section>`;
}

const levelTiles = boxes => boxes.map((n, i) => `<div><b>${n}</b>${LEVELS[i][0]}<small>${LEVELS[i][1]}</small></div>`).join('');
const levelHint = 'Elke kaart heeft een niveau: Zwak, Leren, Redelijk, Goed of Sterk. Tik je ✓ Juist, dan gaat de kaart een niveau omhoog en duurt het langer voor je hem terugziet: Zwak zo weer, Leren morgen, Redelijk na 3 dagen, Goed na 1 week, Sterk na 3 weken. Tik je ✗ Fout, dan gaat de kaart terug naar Zwak. Een foute kaart komt in dezelfde sessie nog een keer terug.';
// Teller "vandaag geoefend": elke beantwoorde kaart telt één keer (een herhaling na een fout niet opnieuw).
async function noteActivity() {
  S.activity = bumpActivity(S.activity, Date.now());
  try { await store.put('meta', { key: 'activity', value: S.activity }); } catch (_) {}
}
async function saveProgress(update) {
  if (!update) return;
  S.progress.set(update.key, update);
  try { await store.put('progress', update); }
  catch (e) { setMsg('err', 'Je voortgang opslaan is niet gelukt: ' + (e && e.message || e)); }
  await noteActivity();
}

// ---------- Flashcards: sessie ----------
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const lang = S.settings.lang || 'es-ES';
    const u = new SpeechSynthesisUtterance(text); u.lang = lang;
    const v = speechSynthesis.getVoices().find(x => x.lang.replace('_', '-').toLowerCase() === lang.toLowerCase());
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (_) {}
}
const speakBtn = text => ('speechSynthesis' in window) ? `<button class="sp" data-act="fc-speak" data-t="${esc(text)}" aria-label="Uitspraak beluisteren">🔊</button>` : '';

function startFlash() {
  const sel = selectWords(S.words, S.blocks, S.settings);
  const plan = fcPlan(sel);
  if (!plan.cards.length) { setMsg('warn', 'Er zijn geen kaarten om te oefenen.'); S.view = 'flashhome'; S.fc = null; render(); return; }
  S.msg = null; S.fc = { sess: newSession(plan.cards), revealed: false, extra: plan.extra }; S.view = 'flash'; render();
}

function viewFlash() {
  const F = S.fc;
  if (!F) { S.view = 'flashhome'; return viewFlashHome(); }
  const sess = F.sess;
  if (!sess.queue.length) return viewFlashEnd();
  const card = sess.queue[0], face = cardFace(card);
  const p = S.progress.get(card.key);
  const tag = [face.soort, card.retry ? 'herhaling' : (p ? 'niveau ' + LEVELS[p.box - 1][0].toLowerCase() : 'nieuw')].filter(Boolean).join(' · ');
  const front = card.dir === 'a' ? face.es : face.nl, back = card.dir === 'a' ? face.nl : face.es;
  const frontSp = card.dir === 'a', pos = Math.min(sess.answered + 1, sess.total);
  const pct = Math.round(sess.answered / sess.total * 100);
  let h = `<div class="fcbar"><span>${card.retry ? 'Herhaling' : 'Kaart ' + pos + ' van ' + sess.total}</span><button class="btn ghost small" data-act="fc-stop">Stoppen</button></div>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <section class="card fcard" ${F.revealed ? '' : 'data-act="fc-reveal"'}>
      <div class="tag">${esc(tag)}</div>
      <div class="big">${esc(front)} ${frontSp ? speakBtn(face.es) : ''}</div>`;
  if (F.revealed) {
    h += `<hr><div class="ans">${esc(back)} ${frontSp ? '' : speakBtn(face.es)}</div>`;
    if (face.meervoud) h += `<div class="hint">meervoud: ${esc(face.meervoud)}</div>`;
    if (face.meta) h += `<div class="hint">${esc(face.meta)}</div>`;
    if (face.forms.length) {
      const f = face.forms, cell = i => f[i] ? `<td><small>${esc(f[i][0])}</small></td><td>${esc(f[i][1])}</td>` : '<td></td><td></td>';
      h += `<table class="formtab">${[0, 1, 2].map(r => `<tr>${cell(r)}${cell(r + 3)}</tr>`).join('')}</table>`;
    }
    if (face.opmerking) h += `<div class="hint">${esc(face.opmerking)}</div>`;
  } else {
    h += `<div class="hint">Denk aan het antwoord en tik dan op de kaart.</div>`;
  }
  h += `</section>`;
  h += F.revealed
    ? `<div class="btnrow"><button class="btn fout" data-act="fc-fout">✗ Fout</button><button class="btn juist" data-act="fc-juist">✓ Juist</button></div>`
    : `<div class="btnrow"><button class="btn" data-act="fc-reveal">Toon antwoord</button></div>`;
  return h;
}

function viewFlashEnd() {
  const s = S.fc.sess;
  const pct = s.answered ? Math.round(s.juist / s.answered * 100) : 0;
  const missed = s.missed.map(c => { const f = cardFace(c); return `<tr><td><b>${esc(f.es)}</b></td><td>${esc(f.nl)}</td></tr>`; }).join('');
  const plan = fcPlan(selectWords(S.words, S.blocks, S.settings));
  return `<section class="card"><h2>Sessie klaar</h2>
    <p>Je beantwoordde <b>${s.answered}</b> kaarten: <b>${s.juist}</b> juist en <b>${s.fout}</b> fout (${pct}%).</p>
    ${missed ? `<h3>Om te onthouden</h3><div class="tablewrap"><table><thead><tr><th>Spaans</th><th>Nederlands</th></tr></thead><tbody>${missed}</tbody></table></div>` : '<p>Geen enkele fout. Mooi werk!</p>'}
    <p class="hint">Je kaarten nu: ${plan.boxes.map((n, i) => LEVELS[i][0].toLowerCase() + ' ' + n).join(' · ')}.</p>
    <p><button class="btn" data-act="fc-start" ${plan.cards.length ? '' : 'disabled'}>${plan.extra ? 'Toch nog oefenen' : 'Nog een sessie'}</button> <button class="btn ghost" data-act="fc-stop">Klaar</button></p></section>`;
}

async function fcAnswer(correct) {
  const F = S.fc; if (!F || !F.revealed || !F.sess.queue.length) return;
  F.revealed = false;
  const r = answerSession(F.sess, S.progress, correct, Date.now());
  if (r.update) {
    S.progress.set(r.update.key, r.update);
    try { await store.put('progress', r.update); }
    catch (e) { setMsg('err', 'Je voortgang opslaan is niet gelukt: ' + (e && e.message || e)); }
    await noteActivity();
  }
  render();
}

      <label class="field">Nieuwe kaarten kiezen<select id="gr-order">${[['random', 'willekeurig uit je selectie'], ['list', 'in volgorde van je lijst']].map(([v, t]) => opt(v, gr.order || 'random', t)).join('')}</select></label>

function startGenus() {
  const plan = grPlan(selectWords(S.words, S.blocks, S.settings));

function viewGenus() {

  if (!G) { S.view = 'genushome'; return viewGenusHome(); }
  const sess = G.sess;
  if (G.feedback) return genusFeedback();
  if (!sess.queue.length) return genusEnd();
  const card = sess.queue[0], w = card.item, p = S.progress.get(card.key);
  const tag = card.retry ? 'herhaling' : (p ? 'niveau ' + LEVELS[p.box - 1][0].toLowerCase() : 'nieuw');
  return genusBar(card.retry ? 'Herhaling' : 'Woord ' + Math.min(sess.answered + 1, sess.total) + ' van ' + sess.total) + `

      <div class="hint">el of la?</div></section>
    <div class="btnrow"><button class="btn pick" data-act="gr-pick" data-v="el">el</button><button class="btn pick" data-act="gr-pick" data-v="la">la</button></div>`;

function genusBar(label) {
  const s = S.gr.sess, pct = Math.round(s.answered / s.total * 100);
  return `<div class="fcbar"><span>${label}</span><button class="btn ghost small" data-act="gr-stop">Stoppen</button></div><div class="prog"><i style="width:${pct}%"></i></div>`;
}

function genusFeedback() {
  const f = S.gr.feedback, w = f.card.item, full = w.lidwoord + ' ' + w.spaans;
  const tip = genusTip(w), note = leerNotitie(w.opmerking);
  const genus = w.genus === 'm' ? 'mannelijk' : w.genus === 'v' ? 'vrouwelijk' : '';
  const verdict = f.correct ? '✓ Juist' : `✗ Het is <b>${esc(w.lidwoord)}</b>, niet ${esc(f.choice)}`;
  let h = genusBar(f.card.retry ? 'Herhaling' : 'Woord ' + Math.min(S.gr.sess.answered, S.gr.sess.total) + ' van ' + S.gr.sess.total) + `
    <section class="card fcard ${f.correct ? 'good' : 'bad'}"><div class="verdict ${f.correct ? 'good' : 'bad'}">${verdict}</div>
      <div class="big">${esc(full)} ${speakBtn(full)}</div>
      <div class="hint">${esc(w.nederlands)}${genus ? ' · ' + genus : ''}${w.meervoud ? ' · meervoud: ' + esc(w.meervoud) : ''}</div>`;
  if (tip) h += `<div class="hint"><b>${tip.fits ? 'Regel' : 'Uitzondering'}:</b> ${esc(tip.rule)}${tip.fits ? '.' : ', maar dit woord is ' + esc(w.lidwoord) + '.'}</div>`;
  if (note) h += `<div class="hint">${esc(note)}</div>`;
  return h + `</section><div class="btnrow"><button class="btn" data-act="gr-next">Volgende</button></div>`;
}

function genusEnd() {

  return `<section class="card"><h2>Sessie klaar</h2>
    <p>Je beantwoordde <b>${s.answered}</b> woorden: <b>${s.juist}</b> juist en <b>${s.fout}</b> fout (${pct}%).</p>

    <p class="hint">Je woorden nu: ${plan.boxes.map((n, i) => LEVELS[i][0].toLowerCase() + ' ' + n).join(' · ')}.</p>
    <p><button class="btn" data-act="gr-start" ${plan.cards.length ? '' : 'disabled'}>${plan.extra ? 'Toch nog oefenen' : 'Nog een sessie'}</button> <button class="btn ghost" data-act="gr-stop">Klaar</button></p></section>`;
}

async function grPick(choice) {
  const G = S.gr; if (!G || G.feedback || !G.sess.queue.length) return;
  const card = G.sess.queue[0], correct = choice === card.item.lidwoord;
  const r = answerSession(G.sess, S.progress, correct, Date.now());
  G.feedback = { card, choice, correct };
  await saveProgress(r.update);
  render();
}

function mrBar(label) {
  const s = S.mr.sess, pct = Math.round(s.answered / s.total * 100);

}

  const M = S.mr;
  if (!M) { S.view = 'meervoudhome'; return viewMeervoudHome(); }

function mrFeedback() {
  const f = S.mr.feedback, w = f.card.item, sing = w.lidwoord + ' ' + w.spaans;
  const art = w.lidwoord === 'el' ? 'los' : w.lidwoord === 'la' ? 'las' : 'los/las';
  const full = art + ' ' + w.meervoud;
  const tip = pluralTip(w), note = leerNotitie(w.opmerking);
  const verdict = f.result === 'juist' ? '✓ Juist' : f.result === 'accent' ? '✗ Bijna: let op het accent' : f.result === 'skip' ? '✗ Het meervoud is' : '✗ Niet juist';
  let h = mrBar(f.card.retry ? 'Herhaling' : 'Woord ' + Math.min(S.mr.sess.answered, S.mr.sess.total) + ' van ' + S.mr.sess.total) + `
    <section class="card fcard ${f.result === 'juist' ? 'good' : 'bad'}"><div class="verdict ${f.result === 'juist' ? 'good' : 'bad'}">${verdict}</div>
      <div class="big">${esc(full)} ${speakBtn(w.meervoud)}</div>
      <div class="hint">${esc(sing)} · ${esc(w.nederlands)}</div>`;
  if (f.given && f.result !== 'juist' && f.result !== 'skip') h += `<div class="hint">Jouw antwoord: <b>${esc(f.given)}</b>${f.spoken ? ' (gesproken)' : ''}</div>`;
  if (f.given && f.result === 'juist' && f.spoken) h += `<div class="hint">Je zei: <b>${esc(f.given)}</b>. Gesproken antwoorden tellen zonder accent.</div>`;
  if (tip) h += `<div class="hint"><b>Regel:</b> ${esc(tip)}</div>`;
  if (note) h += `<div class="hint">${esc(note)}</div>`;
  return h + `</section><div class="btnrow"><button class="btn" data-act="mr-next">Volgende</button></div>`;
}

function mrEnd() {

}

async function mrSubmit(given, spoken, skip) {
  const M = S.mr; if (!M || M.feedback || !M.sess.queue.length) return;
  const card = M.sess.queue[0];
  const chk = skip ? { result: 'skip' } : checkPlural(card.item.meervoud, given, spoken);
  if (chk.result === 'leeg') { const st = $('#mr-status'); if (st) st.textContent = 'Typ eerst een antwoord, of tik op "Ik weet het niet".'; return; }
  const correct = chk.result === 'juist';
  const r = answerSession(M.sess, S.progress, correct, Date.now());
  M.feedback = { card, given: given || '', spoken: !!spoken, result: chk.result };
  await saveProgress(r.update);
  render();
}
const mrCheck = () => { const i = $('#mr-input'); return mrSubmit(i ? i.value : '', i ? isSpoken(i.value) : false, false); };

// Spreken: de app blijft luisteren tot jij op "✓ Klaar" tikt, toont live wat ze hoort in het invoerveld,
// en beoordeelt pas als jij op Controleer tikt (zodat je eerst kunt corrigeren).
// Houdt bij welke luistersessie actief is, zodat de microfoon altijd stopt
// (anders blijft op een iPad het oranje microfoon-bolletje branden, ook op Home).
let L = null;          // actieve luistersessie
let spokenText = '';   // laatst gehoorde tekst die in het invoerveld is gezet
function stopListening() {
  const s = L; L = null;
  if (s) { s.cancelled = true; clearTimeout(s.timer); try { s.rec.abort(); } catch (_) {} }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) stopListening(); });
window.addEventListener('pagehide', stopListening);

// Aarzelwoordjes ("eh", "ehm", "uh") tellen niet mee bij spreken.
const FILLERS = /(^|\s)(e+h+m*|e+m+|m+m+|h+m+|u+h+m*|a+h+m+)(?=\s|$)/gi;
const cleanSpoken = t => t.replace(FILLERS, ' ').replace(/\s+/g, ' ').trim();
// Het antwoord telt als "gesproken" (accenten tellen niet) zolang je de gehoorde tekst niet zelf aanpast.
const isSpoken = v => !!spokenText && v.trim() === spokenText;

function micButton(listening) {
  const b = document.querySelector('.mic'); if (!b) return;
  b.disabled = false; b.classList.toggle('listening', listening);
  b.textContent = listening ? '✓ Klaar' : '🎤 Spreek';
}
function micStatus(t) { const s = $('#mr-status'); if (s) s.textContent = t; }

// Eén luistersessie voor Meervoud, Werkwoordtabel en Spreekoefening. Een tweede tik op de knop (✓ Klaar) beëindigt het luisteren.
function listenAnswer(isRight) {
  if (L) { finishListening(); return; }
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Rec) return micStatus('Spraakherkenning werkt niet in deze browser. Typ het antwoord.');
  if (!navigator.onLine) return micStatus('Spreken werkt alleen online. Typ het antwoord.');
  const rec = new Rec(); rec.lang = S.settings.lang || 'es-ES'; rec.interimResults = true; rec.maxAlternatives = 5; rec.continuous = true;
  const s = L = { rec, segs: [], error: '', finishing: false, cancelled: false, done: false, timer: null, isRight };
  const field = $('#mr-input'); if (field) field.value = '';
  spokenText = '';
  micButton(true); micStatus('Ik luister… Spreek en tik op ✓ Klaar als je klaar bent.');
  rec.onresult = e => {
    if (s.cancelled) return;
    s.segs = Array.from(e.results).map(r => Array.from(r).map(x => x.transcript.trim()).filter(Boolean));
    const live = spokenFrom(s, false), f = $('#mr-input');
    if (f) f.value = live;
    if (live) micStatus('Ik hoor: ' + live);
  };
  rec.onerror = e => {
    if (s.cancelled || e.error === 'aborted') return;
    if (e.error !== 'no-speech') {
      s.error = { 'not-allowed': 'De microfoon is niet toegestaan. Geef toestemming in je browser, of typ het antwoord.', 'service-not-allowed': 'De microfoon is niet toegestaan. Typ het antwoord.',
        'network': 'Spreken werkt alleen online. Typ het antwoord.', 'audio-capture': 'Geen microfoon gevonden. Typ het antwoord.' }[e.error] || 'Spreken lukte niet. Typ het antwoord.';
    }
    endListening(s);
  };
  rec.onend = () => endListening(s);
  try { rec.start(); } catch (_) { L = null; micButton(false); micStatus('Spreken lukte niet. Typ het antwoord.'); }
}
// Tekst uit de gehoorde stukken: bij één stuk de variant die klopt, anders de beste van elk stuk achter elkaar.
function spokenFrom(s, final) {
  let t;
  if (s.segs.length === 1) t = s.segs[0].find(x => s.isRight(x)) || s.segs[0][0] || '';
  else t = s.segs.map(g => g[0] || '').join(' ');
  return final ? cleanSpoken(t) : t;
}
function finishListening() {
  const s = L; if (!s || s.finishing) return;
  s.finishing = true;
  const b = document.querySelector('.mic'); if (b) b.disabled = true;
  try { s.rec.stop(); } catch (_) {}
  s.timer = setTimeout(() => endListening(s), 1500); // voor het geval iOS het einde niet meldt
}
// Zet het resultaat in het invoerveld; de microfoon is dan uit. Beoordelen doet de gebruiker met Controleer.
function endListening(s) {
  if (s.done || s.cancelled) return;
  s.done = true; clearTimeout(s.timer);
  if (L === s) L = null;
  try { s.rec.abort(); } catch (_) {}
  const text = spokenFrom(s, true), f = $('#mr-input');
  micButton(false);
  if (text) {
    spokenText = text; if (f) { f.value = text; }
    micStatus('Dit hoorde ik. Klopt het niet? Pas het aan of tik opnieuw op 🎤. Tik op Controleer als het goed is.');
  } else {
    micStatus(s.error || 'Ik hoorde niets. Probeer opnieuw of typ het antwoord.');
  }
}
function mrListen() {
  const M = S.mr; if (!M || M.feedback) return;
  const exp = M.sess.queue[0].item.meervoud;
  listenAnswer(t => checkPlural(exp, t, true).result === 'juist');
}

// ---------- Oefening: overeenstemming ----------
function ovPlan(sel) {
  const ids = new Set(sel.map(w => w.id));
  const fams = adjectiveFamilies(S.words).filter(f => ids.has(f.id));
  return sessionPlan(ovCards(fams), S.progress, Object.assign({}, S.settings.ov, { dir: 'a', verbs: false }), Date.now());
}
// Zelfstandige naamwoorden voor de vragen: bij voorkeur uit je selectie, anders uit de hele lijst.
function ovNouns() {
  const sel = agreementNouns(selectWords(S.words, S.blocks, S.settings));
  return sel.length >= 8 ? sel : agreementNouns(S.words);
}

    <p><b>${plan.dueTotal}</b> aan de beurt · <b>${plan.newTotal}</b> nieuw beschikbaar · <b>${plan.learned}</b> al geoefend</p>
    <p class="hint">Hoe goed ken je je woorden?</p>
    <div class="boxes">${levelTiles(plan.boxes)}</div>

    <p><button class="btn" data-act="ov-start" ${plan.cards.length ? '' : 'disabled'}>${btn}</button></p>
    <details><summary>Instellingen oefening</summary>
      <label class="field">Woorden per sessie<select id="ov-size">${[10, 20, 30, 50].map(n => opt(n, ov.size, n)).join('')}</select></label>
      <label class="field">Nieuwe woorden per sessie (maximum)<select id="ov-new">${[5, 10, 15, 20].map(n => opt(n, ov.newMax, n)).join('')}</select></label>
      <label class="field">Nieuwe kaarten kiezen<select id="ov-order">${[['random', 'willekeurig uit je selectie'], ['list', 'in volgorde van je lijst']].map(([v, t]) => opt(v, ov.order || 'random', t)).join('')}</select></label>

function startOvereen() {
  const plan = ovPlan(selectWords(S.words, S.blocks, S.settings)), nouns = ovNouns();
  if (!plan.cards.length || !nouns.length) { setMsg('warn', 'Er zijn geen woorden om te oefenen.'); S.view = 'overeenhome'; S.ov = null; render(); return; }
  S.msg = null; S.ov = { sess: newSession(plan.cards), feedback: null, nouns }; S.view = 'overeen'; render();
}

function ovBar(label) {
  const s = S.ov.sess, pct = Math.round(s.answered / s.total * 100);
  return `<div class="fcbar"><span>${label}</span><button class="btn ghost small" data-act="ov-stop">Stoppen</button></div><div class="prog"><i style="width:${pct}%"></i></div>`;
}

function viewOvereen() {
  const O = S.ov;
  if (!O) { S.view = 'overeenhome'; return viewOvereenHome(); }
  const sess = O.sess;
  if (O.feedback) return ovFeedback();
  if (!sess.queue.length) return ovEnd();
  const card = sess.queue[0], fam = card.item, p = S.progress.get(card.key);
  if (!card.q) card.q = agreementQuestion(fam, O.nouns, Math.random, card.avoid);
  const q = card.q;
  const tag = card.retry ? 'herhaling' : (p ? 'niveau ' + LEVELS[p.box - 1][0].toLowerCase() : 'nieuw');
  return ovBar(card.retry ? 'Herhaling' : 'Woord ' + Math.min(sess.answered + 1, sess.total) + ' van ' + sess.total) + `
    <section class="card fcard"><div class="tag">${esc(tag)}</div>
      <div class="big">${esc(q.pre)}<span class="blank">____</span>${esc(q.post)}</div>
      <div class="hint">${esc(q.noun.nederlands)} · <b>${esc(fam.lemma)}</b> = ${esc(fam.nl)}</div>
      <div class="hint">Welke vorm van <b>${esc(fam.lemma)}</b> past hier?</div></section>
    <div class="optgrid${(m => m >= 12 ? ' l2' : m >= 9 ? ' l1' : '')(Math.max(...q.options.map(x => x.length)))}">${q.options.map((o, i) => `<button class="btn pick" data-act="ov-pick" data-v="${esc(o)}"><small>${i + 1}</small> ${esc(o)}</button>`).join('')}</div>`;
}

function ovFeedback() {
  const f = S.ov.feedback, q = f.card.q, fam = f.card.item, fm = fam.forms;
  const verdict = f.correct ? '✓ Juist' : `✗ Het is <b>${esc(q.answer)}</b>, niet ${esc(f.choice)}`;
  const gTxt = q.gender === 'm' ? 'mannelijk' : 'vrouwelijk', nTxt = q.plural ? 'meervoud' : 'enkelvoud';
  let h = ovBar(f.card.retry ? 'Herhaling' : 'Woord ' + Math.min(S.ov.sess.answered, S.ov.sess.total) + ' van ' + S.ov.sess.total) + `
    <section class="card fcard ${f.correct ? 'good' : 'bad'}"><div class="verdict ${f.correct ? 'good' : 'bad'}">${verdict}</div>
      <div class="big">${esc(q.full)} ${speakBtn(q.full)}</div>
      <div class="hint">${esc(q.noun.nederlands)} · ${esc(fam.nl)}</div>
      <div class="hint"><b>Regel:</b> ${esc(q.noun.spaans)} is ${gTxt} en staat hier in het ${nTxt}. ${fam.invariable ? esc(fam.lemma) + ' heeft voor mannelijk en vrouwelijk dezelfde vorm; alleen enkelvoud of meervoud telt.' : 'Je neemt dus de vorm voor ' + gTxt + ' ' + nTxt + ': <b>' + esc(q.answer) + '</b>.'}</div>`;
  h += fam.invariable
    ? `<table class="formtab"><tr><td><small>enkelvoud</small></td><td>${esc(fm.s)}</td><td><small>meervoud</small></td><td>${esc(fm.p)}</td></tr></table>`
    : `<table class="formtab"><tr><td></td><td><small>enkelvoud</small></td><td><small>meervoud</small></td></tr>
       <tr><td><small>mannelijk</small></td><td>${esc(fm.ms)}</td><td>${esc(fm.mp)}</td></tr>
       <tr><td><small>vrouwelijk</small></td><td>${esc(fm.fs)}</td><td>${esc(fm.fp)}</td></tr></table>`;
  return h + `</section><div class="btnrow"><button class="btn" data-act="ov-next">Volgende</button></div>`;
}

function ovEnd() {
  const s = S.ov.sess, pct = s.answered ? Math.round(s.juist / s.answered * 100) : 0;
  const missed = s.missed.map(c => { const f = c.item.forms; return `<tr><td><b>${esc(c.item.lemma)}</b></td><td>${esc(c.item.invariable ? f.s + ' / ' + f.p : f.ms + ', ' + f.fs + ', ' + f.mp + ', ' + f.fp)}</td></tr>`; }).join('');
  const plan = ovPlan(selectWords(S.words, S.blocks, S.settings));
  return `<section class="card"><h2>Sessie klaar</h2>
    <p>Je beantwoordde <b>${s.answered}</b> woorden: <b>${s.juist}</b> juist en <b>${s.fout}</b> fout (${pct}%).</p>
    ${missed ? `<h3>Om te onthouden</h3><div class="tablewrap"><table><thead><tr><th>Woord</th><th>Vormen</th></tr></thead><tbody>${missed}</tbody></table></div>` : '<p>Geen enkele fout. Mooi werk!</p>'}
    <p class="hint">Je woorden nu: ${plan.boxes.map((n, i) => LEVELS[i][0].toLowerCase() + ' ' + n).join(' · ')}.</p>
    <p><button class="btn" data-act="ov-start" ${plan.cards.length ? '' : 'disabled'}>${plan.extra ? 'Toch nog oefenen' : 'Nog een sessie'}</button> <button class="btn ghost" data-act="ov-stop">Klaar</button></p></section>`;
}

async function ovPick(choice) {
  const O = S.ov; if (!O || O.feedback || !O.sess.queue.length) return;
  const card = O.sess.queue[0], correct = choice === card.q.answer;
  const r = answerSession(O.sess, S.progress, correct, Date.now());
  // een foute kaart komt terug met een andere zin (ander zelfstandig naamwoord of ander getal)
  O.sess.queue.forEach(c => { if (c.retry && c.key === card.key && c.q === card.q) { c.avoid = card.q.sig; delete c.q; } });
  O.feedback = { card, choice, correct };
  await saveProgress(r.update);
  render();
}

// ---------- Oefening: werkwoordtabel ----------
function wtPlan() {
  return sessionPlan(verbFormCards(S.verbs, S.settings.wt.only), S.progress, Object.assign({}, S.settings.wt, { dir: 'a', verbs: false, mix: S.settings.wt.mix !== false }), Date.now());

function wtBar(label) {

function wtFeedback() {
  const f = S.wt.feedback, v = f.card.item, i = f.card.pi, per = PERSONS[i], form = v[VERB_FORMS[i]];
  const full = v.infinitief === 'gustar' ? form : per[0].split(' / ')[0] + ' ' + form;
  const tip = verbTip(v, i), note = leerNotitie(v.opmerking);
  const good = f.result === 'juist';
  const verdict = good ? '✓ Juist' : f.result === 'accent' ? '✗ Bijna: let op het accent' : f.result === 'pronoun' ? '✗ Bijna: het voornaamwoord (me, te, se…) hoort erbij' : f.result === 'skip' ? '✗ De vorm is' : '✗ Niet juist';
  let h = wtBar(f.card.retry ? 'Herhaling' : 'Vorm ' + Math.min(S.wt.sess.answered, S.wt.sess.total) + ' van ' + S.wt.sess.total) + `
    <section class="card fcard ${good ? 'good' : 'bad'}"><div class="verdict ${good ? 'good' : 'bad'}">${verdict}</div>
      <div class="big">${esc(full)} ${speakBtn(form)}</div>
      <div class="hint">${esc(v.infinitief)} = ${esc(v.nederlands)}${v.type ? ' · ' + esc(v.groep) + ' · ' + esc(v.type) : ''}</div>`;
  if (f.given && !good && f.result !== 'skip') h += `<div class="hint">Jouw antwoord: <b>${esc(f.given)}</b>${f.spoken ? ' (gesproken)' : ''}</div>`;
  if (f.given && good && f.spoken) h += `<div class="hint">Je zei: <b>${esc(f.given)}</b>. Gesproken antwoorden tellen zonder accent.</div>`;
  if (tip) h += `<div class="hint"><b>Regel:</b> ${esc(tip)}</div>`;
  if (note && !/^(zie |meervoud van)/i.test(note)) h += `<div class="hint">${esc(note)}</div>`;
  const cell = k => `<div class="${k === i ? 'on' : ''}"><small>${esc(PERSONS[k][0])}</small><span>${esc(v[VERB_FORMS[k]] || '')}</span></div>`;
  h += `<div class="vtab">${[0, 3, 1, 4, 2, 5].map(cell).join('')}</div>`;
  return h + `</section><div class="btnrow"><button class="btn" data-act="wt-next">Volgende</button></div>`;
}

function wtEnd() {
  const s = S.wt.sess, pct = s.answered ? Math.round(s.juist / s.answered * 100) : 0;
  const missed = s.missed.map(c => `<tr><td><b>${esc(c.item.infinitief)}</b> · ${esc(PERSONS[c.pi][0])}</td><td>${esc(c.item[VERB_FORMS[c.pi]])}</td></tr>`).join('');
  const plan = wtPlan();
  return `<section class="card"><h2>Sessie klaar</h2>
    <p>Je beantwoordde <b>${s.answered}</b> vormen: <b>${s.juist}</b> juist en <b>${s.fout}</b> fout (${pct}%).</p>
    ${missed ? `<h3>Om te onthouden</h3><div class="tablewrap"><table><thead><tr><th>Werkwoord · persoon</th><th>Vorm</th></tr></thead><tbody>${missed}</tbody></table></div>` : '<p>Geen enkele fout. Mooi werk!</p>'}
    <p class="hint">Je vormen nu: ${plan.boxes.map((n, i) => LEVELS[i][0].toLowerCase() + ' ' + n).join(' · ')}.</p>
    <p><button class="btn" data-act="wt-start" ${plan.cards.length ? '' : 'disabled'}>${plan.extra ? 'Toch nog oefenen' : 'Nog een sessie'}</button> <button class="btn ghost" data-act="wt-stop">Klaar</button></p></section>`;
}

async function wtSubmit(given, spoken, skip) {
  const W = S.wt; if (!W || W.feedback || !W.sess.queue.length) return;
  const card = W.sess.queue[0];
  const chk = skip ? { result: 'skip' } : checkForm(card.item[VERB_FORMS[card.pi]], given, spoken);
  if (chk.result === 'leeg') { const st = $('#mr-status'); if (st) st.textContent = 'Typ eerst een antwoord, of tik op "Ik weet het niet".'; return; }
  const r = answerSession(W.sess, S.progress, chk.result === 'juist', Date.now());
  W.feedback = { card, given: given || '', spoken: !!spoken, result: chk.result };
  await saveProgress(r.update);
  render();
}
const wtCheck = () => { const i = $('#mr-input'); return wtSubmit(i ? i.value : '', i ? isSpoken(i.value) : false, false); };
function wtListen() {
  const W = S.wt; if (!W || W.feedback) return;
  const c = W.sess.queue[0];
  const exp = c.item[VERB_FORMS[c.pi]];
  listenAnswer(t => checkForm(exp, t, true).result === 'juist');
}

function znFeedback() {
  const f = S.zn.feedback, s = f.card.sent, good = f.result === 'juist';

  const p = ZP.find(x => x.id === f.card.id);
  let h = znBar(f.card.retry ? 'Herhaling' : 'Zin ' + Math.min(S.zn.sess.answered, S.zn.sess.total) + ' van ' + S.zn.sess.total) + `
    <section class="card fcard ${good ? 'good' : 'bad'}"><div class="verdict ${good ? 'good' : 'bad'}">${verdict}</div>
      <div class="big">${esc(s.es)} ${speakBtn(s.es)}</div>
      <div class="hint">${esc(s.nl)}</div>`;
  if (f.given && !good && f.result !== 'skip') h += `<div class="hint">Jouw antwoord: <b>${esc(f.given)}</b>${f.spoken ? ' (gesproken)' : ''}</div>`;
  if (f.given && good && f.spoken) h += `<div class="hint">Je zei: <b>${esc(f.given)}</b>. Gesproken antwoorden tellen zonder accent.</div>`;
  if (s.alts && s.alts.length) h += `<div class="hint">Ook goed: ${s.alts.map(x => esc(x)).join(' · ')}</div>`;
  if (p && p.tip) h += `<div class="hint"><b>Regel:</b> ${esc(p.tip)}</div>`;
  for (const [inf, i] of s.verbs) {
    const v = S.verbs.find(x => x.infinitief === inf), t = v && verbTip(v, i);

  if (s.nouns.length) h += `<div class="hint">${s.nouns.map(n => `<b>${esc(n.lidwoord + ' ' + n.spaans)}</b> = ${esc(n.nederlands.split(',')[0])}`).join(' · ')}</div>`;
  return h + `</section><div class="btnrow"><button class="btn" data-act="zn-next">Volgende</button></div>`;
}

}

async function znSubmit(given, spoken, skip) {
  const Z = S.zn; if (!Z || Z.feedback || !Z.sess.queue.length) return;
  const card = Z.sess.queue[0];
  if (spoken && !skip && checkSentenceAny(card.sent, given, true).result !== 'juist' && sentencePartial(card.sent, given)) {
    const st = $('#mr-status'); if (st) st.textContent = 'Ik verstond alleen: "' + given + '". Dat telt niet. Tik opnieuw op 🎤 en spreek de hele zin, of typ hem.';
    return;
  }
  const chk = skip ? { result: 'skip' } : checkSentenceAny(card.sent, given, spoken);
  if (chk.result === 'leeg') { const st = $('#mr-status'); if (st) st.textContent = 'Zeg of typ eerst een zin, of tik op "Ik weet het niet".'; return; }
  const r = answerSession(Z.sess, S.progress, chk.result === 'juist', Date.now());
  Z.feedback = { card, given: given || '', spoken: !!spoken, result: chk.result };
  await saveProgress(r.update);
  render();
}
const znCheck = () => { const i = $('#mr-input'); return znSubmit(i ? i.value : '', i ? isSpoken(i.value) : false, false); };
function znListen() {

}

function viewWoorden() {

    (!q || w.spaans.toLowerCase().includes(q) || w.nederlands.toLowerCase().includes(q)));
  const shown = list.slice(0, S.limit);
  const soorten = Array.from(new Set(S.words.map(w => w.soort))).sort();
  const rows = shown.map(w => {
    const meta = [w.soort, w.genus, w.thema, w.hoofdstuk ? 'les ' + w.hoofdstuk + '.' + w.les : ''].filter(Boolean).join(' · ');
    return `<tr><td><b>${esc((w.lidwoord ? w.lidwoord + ' ' : '') + w.spaans)}</b>${w.meervoud ? `<br><small>meervoud: ${esc(w.meervoud)}</small>` : ''}</td>

}

function repLine(r) {
  const parts = [];
  if (r.nieuw) parts.push(`<b>${r.nieuw}</b> nieuw`);
  if (r.bijgewerkt) parts.push(`<b>${r.bijgewerkt}</b> bijgewerkt`);
  if (r.samengevoegd) parts.push(`<b>${r.samengevoegd}</b> samengevoegd`);
  if (r.ongewijzigd) parts.push(`<b>${r.ongewijzigd}</b> ongewijzigd`);
  if (r.overgeslagen) parts.push(`<b>${r.overgeslagen}</b> overgeslagen`);
  if (r.waarschuwingen) parts.push(`<b>${r.waarschuwingen}</b> waarschuwingen`);
  return parts.join(' · ') || 'niets te doen';
}

function viewPlan() {
  const p = S.plan;
  const items = p.items.map(it => {
    const det = it.report.details.filter(d => d.type !== 'ongewijzigd');
    const rows = det.slice(0, 300).map(d => `<tr class="t-${d.type}"><td>${d.regel}</td><td>${esc(d.spaans)}</td><td>${esc(d.type)}</td><td>${esc(d.tekst)}</td></tr>`).join('');
    return `<div class="plan"><h3>${esc(it.naam)} <small>(${it.kind})</small></h3><p>${repLine(it.report)}</p>
      ${det.length ? `<details><summary>${det.length} meldingen bekijken</summary><div class="tablewrap"><table><thead><tr><th>Regel</th><th>Woord</th><th>Soort</th><th>Toelichting</th></tr></thead><tbody>${rows}</tbody></table></div>${det.length > 300 ? '<p class="hint">Alleen de eerste 300 getoond.</p>' : ''}</details>` : ''}</div>`;
  }).join('');
  const errs = p.errors.map(e => `<div class="msg err">${esc(e)}</div>`).join('');
  return `<section class="card"><h2>Overzicht voor je tikt</h2>${errs}${items}
    <p><button class="btn" data-act="toepassen" ${p.items.length ? '' : 'disabled'}>Toepassen</button> <button class="btn ghost" data-act="annuleer">Annuleren</button></p></section>`;
}

function viewBeheer() {
  const pers = S.persisted === true ? 'Je toestel bewaart deze gegevens vast.' : S.persisted === false ? 'Je browser kan deze gegevens na verloop van tijd wissen. Voeg de app toe aan je beginscherm en maak regelmatig een back-up.' : '';
  return `<section class="card"><h2>Back-up</h2>
    <p>Bewaar woorden, werkwoorden en je voortgang in één bestand. Doe dit regelmatig, want je woorden staan alleen op dit toestel.</p>
    <p class="hint">${esc(backupStatus(S.lastBackup, true, Date.now()).text)}</p>
    <p class="hint">${esc(pers)}</p>
    <p><button class="btn" data-act="backup">Back-up maken</button></p>
    <p><label class="field">Back-up terugzetten<input id="terug" type="file" accept=".json,application/json"></label></p></section>
    <section class="card"><h2>Spaanse spraak</h2><p>Voor de uitspraak (🔊) en voor spreken. Kies de variant die je wilt horen en gebruiken.</p>
    <label class="field">Spaanse stem<select id="lang"><option value="es-ES" ${S.settings.lang === 'es-ES' ? 'selected' : ''}>Spanje (es-ES)</option><option value="es-MX" ${S.settings.lang === 'es-MX' ? 'selected' : ''}>Mexico (es-MX)</option></select></label></section>
    <section class="card"><h2>Voortgang wissen</h2><p>Begin opnieuw met alle oefeningen. Je woorden en werkwoorden blijven staan.</p>
    <p><button class="btn ghost" data-act="fc-reset">Voortgang wissen</button></p></section>
    <section class="card"><h2>Alles wissen</h2><p>Verwijdert alle woorden, werkwoorden en voortgang van dit toestel.</p>
    <p><button class="btn danger" data-act="wissen">Alles wissen</button></p></section>
    <section class="card"><p class="hint">Spaans leren — Versie 0.9.3.</p></section>`;
}

// ---------- Acties ----------
async function readFileText(file) {
  const text = await file.text();
  return text;
}

async function planImport(files) {
  const plan = { items: [], errors: [] };
  let wordsWork = S.words, verbsWork = S.verbs;
  for (const f of files) {
    let text;
    try { text = await readFileText(f); } catch (e) { plan.errors.push(f.name + ': kan het bestand niet lezen.'); continue; }
    if (text.includes('�')) plan.errors.push(f.name + ': het bestand lijkt niet in UTF-8 opgeslagen; speciale tekens (á, é, ñ) kunnen verkeerd staan. Exporteer opnieuw als CSV UTF-8.');
    const t = readTable(text);
    if (!t.kind) { plan.errors.push(f.name + ': ' + t.error); continue; }
    if (t.kind === 'woorden') { const r = mergeWords(wordsWork, t.records); wordsWork = r.words; plan.items.push({ naam: f.name, kind: 'woorden', report: r.report }); }
    else { const r = mergeVerbs(verbsWork, t.records); verbsWork = r.verbs; plan.items.push({ naam: f.name, kind: 'werkwoorden', report: r.report }); }
  }
  plan.words = wordsWork; plan.verbs = verbsWork;
  return plan;
}

async function applyPlan() {
  const p = S.plan; if (!p) return;
  try {
    if (p.items.some(i => i.kind === 'woorden')) await store.replaceAll('words', p.words);
    if (p.items.some(i => i.kind === 'werkwoorden')) await store.replaceAll('verbs', p.verbs);
    await loadAll();
    S.plan = null;
    setMsg('ok', 'Gelukt: ' + plural(S.words.length, 'woord', 'woorden') + ' en ' + plural(S.verbs.length, 'werkwoord', 'werkwoorden') + ' staan nu in de app.');
    S.view = 'start';
  } catch (e) { setMsg('err', 'Opslaan is niet gelukt: ' + (e && e.message || e) + '. Er is niets veranderd.'); }
  render();
}

async function makeBackup() {
  const progress = await store.getAll('progress');
  const data = { app: 'spaans-leren', versie: 1, datum: new Date().toISOString(), words: S.words, verbs: S.verbs, progress, settings: S.settings };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'spaans-leren-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  S.lastBackup = new Date().toISOString();
  try { await store.put('meta', { key: 'lastBackup', value: S.lastBackup }); } catch (_) {}
  setMsg('ok', 'Back-up gemaakt: ' + a.download + '. Bewaar het bestand op een veilige plek (bijvoorbeeld iCloud Drive of Google Drive).');
  render();
}

async function restoreBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || data.app !== 'spaans-leren' || !Array.isArray(data.words) || !Array.isArray(data.verbs)) throw new Error('dit is geen back-up van deze app');
    if (!confirm('Dit vervangt alle gegevens in de app door de back-up van ' + (data.datum || '').slice(0, 10) + ' (' + data.words.length + ' woorden, ' + data.verbs.length + ' werkwoorden). Doorgaan?')) return;
    const prog = (Array.isArray(data.progress) ? data.progress : []).filter(p => p && typeof p.key === 'string');
    const ok = x => x && x.id != null;
    if (!data.words.every(ok) || !data.verbs.every(ok)) throw new Error('de back-up is beschadigd (woorden zonder id)');
    await store.replaceMany({ words: data.words, verbs: data.verbs, progress: prog, meta: [{ key: 'settings', value: data.settings || { block: null, soorten: [] } }].concat(Number.isNaN(Date.parse(data.datum)) ? [] : [{ key: 'lastBackup', value: data.datum }]) });
    await loadAll();
    S.msg = null;
    setMsg('ok', 'Back-up teruggezet: ' + plural(S.words.length, 'woord', 'woorden') + ' en ' + plural(S.verbs.length, 'werkwoord', 'werkwoorden') + '.');
    S.view = 'start';
  } catch (e) { setMsg('err', 'Terugzetten is niet gelukt: ' + (e && e.message || e) + '. Er is niets veranderd.'); }
  render();
}

async function resetProgress() {
  if (!confirm('Alle voortgang van de oefeningen wissen? Je woorden blijven staan.')) return;
  await store.replaceAll('progress', []);
  await loadAll();
  setMsg('ok', 'De voortgang van de oefeningen is gewist.'); S.view = 'start'; render();
}

async function wipeAll() {
  if (!confirm('Alle woorden, werkwoorden en voortgang van dit toestel verwijderen?')) return;
  if (!confirm('Zeker weten? Dit kan niet ongedaan worden gemaakt, tenzij je een back-up hebt.')) return;
  for (const n of ['words', 'verbs', 'progress', 'meta']) await store.replaceAll(n, []);
  await loadAll(); S.plan = null;
  setMsg('ok', 'Alles is gewist.'); S.view = 'start'; render();
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'nav') { S.view = el.dataset.v; S.msg = null; S.fc = null; S.gr = null; S.mr = null; S.ov = null; S.wt = null; S.zn = null; if (S.view !== 'import') S.plan = null; render(); }
  else if (act === 'fc-start') startFlash();
  else if (act === 'fc-reveal') { if (S.fc && !S.fc.revealed) { S.fc.revealed = true; render(); } }
  else if (act === 'fc-juist') fcAnswer(true);
  else if (act === 'fc-fout') fcAnswer(false);
  else if (act === 'fc-stop') { S.fc = null; S.view = 'flashhome'; S.msg = null; render(); }
  else if (act === 'fc-speak') speak(el.dataset.t);
  else if (act === 'fc-reset') resetProgress();
  else if (act === 'zn-start') startSpreek();
  else if (act === 'zn-check') znCheck();
  else if (act === 'zn-skip') znSubmit('', false, true);
  else if (act === 'zn-mic') znListen();
  else if (act === 'zn-next') { if (S.zn) { S.zn.feedback = null; render(); } }
  else if (act === 'zn-stop') { S.zn = null; S.view = 'spreekhome'; S.msg = null; render(); }
  else if (act === 'wt-start') startWerkwoord();
  else if (act === 'wt-check') wtCheck();
  else if (act === 'wt-skip') wtSubmit('', false, true);
  else if (act === 'wt-mic') wtListen();
  else if (act === 'wt-next') { if (S.wt) { S.wt.feedback = null; render(); } }
  else if (act === 'wt-stop') { S.wt = null; S.view = 'werkwoordhome'; S.msg = null; render(); }
  else if (act === 'ov-start') startOvereen();
  else if (act === 'ov-pick') ovPick(el.dataset.v);
  else if (act === 'ov-next') { if (S.ov) { S.ov.feedback = null; render(); } }
  else if (act === 'ov-stop') { S.ov = null; S.view = 'overeenhome'; S.msg = null; render(); }
  else if (act === 'mr-start') startMeervoud();
  else if (act === 'mr-check') mrCheck();
  else if (act === 'mr-skip') mrSubmit('', false, true);
  else if (act === 'mr-mic') mrListen();
  else if (act === 'mr-acc') { const i = $('#mr-input'); if (i) { const p = i.selectionStart == null ? i.value.length : i.selectionStart, q = i.selectionEnd == null ? p : i.selectionEnd; i.value = i.value.slice(0, p) + el.dataset.v + i.value.slice(q); i.focus(); try { i.setSelectionRange(p + 1, p + 1); } catch (_) {} } }
  else if (act === 'mr-next') { if (S.mr) { S.mr.feedback = null; render(); } }
  else if (act === 'mr-stop') { S.mr = null; S.view = 'meervoudhome'; S.msg = null; render(); }
  else if (act === 'gr-start') startGenus();
  else if (act === 'gr-pick') grPick(el.dataset.v);
  else if (act === 'gr-next') { if (S.gr) { S.gr.feedback = null; render(); } }
  else if (act === 'gr-stop') { S.gr = null; S.view = 'genushome'; S.msg = null; render(); }
  else if (act === 'soort') {
    const s = el.dataset.v, a = S.settings.soorten;
    S.settings.soorten = a.includes(s) ? a.filter(x => x !== s) : a.concat(s);
    await saveSettings(); render();
  }
  else if (act === 'meer') { S.limit += 150; render(); }
  else if (act === 'toepassen') applyPlan();
  else if (act === 'annuleer') { S.plan = null; render(); }
  else if (act === 'backup') makeBackup();
  else if (act === 'wissen') wipeAll();
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'blk') { S.settings.block = el.value === '' ? null : +el.value; await saveSettings(); render(); }
  else if (/^(fc|gr|mr|ov|zn)-order$/.test(el.id)) {
    S.settings[el.id.slice(0, 2)].order = el.value === 'list' ? 'list' : 'random';
    await saveSettings(); render();
    const d = document.querySelector('#app details'); if (d) d.open = true;
  }
  else if (el.id === 'soortsel') { S.soortFilter = el.value; S.limit = 150; render(); }
  else if (el.id === 'zn-size' || el.id === 'zn-new') {
    if (el.id === 'zn-size') S.settings.zn.size = +el.value; else S.settings.zn.newMax = +el.value;
    await saveSettings(); render();
    const d = document.querySelector('#app details'); if (d) d.open = true;
  }
  else if (el.id === 'wt-size' || el.id === 'wt-new' || el.id === 'wt-only' || el.id === 'wt-mix') {
    if (el.id === 'wt-mix') S.settings.wt.mix = el.value === '1'; else if (el.id === 'wt-size') S.settings.wt.size = +el.value; else if (el.id === 'wt-new') S.settings.wt.newMax = +el.value; else S.settings.wt.only = el.value;
    await saveSettings(); render();
    const d = document.querySelector('#app details'); if (d) d.open = true;
  }
  else if (el.id === 'ov-size' || el.id === 'ov-new') {
    if (el.id === 'ov-size') S.settings.ov.size = +el.value; else S.settings.ov.newMax = +el.value;
    await saveSettings(); render();
    const d = document.querySelector('#app details'); if (d) d.open = true;
  }
  else if (el.id === 'mr-size' || el.id === 'mr-new') {
    if (el.id === 'mr-size') S.settings.mr.size = +el.value; else S.settings.mr.newMax = +el.value;
    await saveSettings(); render();
    const d = document.querySelector('#app details'); if (d) d.open = true;
  }
  else if (el.id === 'lang') { S.settings.lang = el.value; await saveSettings(); setMsg('ok', 'Spaanse spraak ingesteld op ' + (el.value === 'es-MX' ? 'Mexico (es-MX)' : 'Spanje (es-ES)') + '.'); render(); }
  else if (el.id === 'gr-size' || el.id === 'gr-new') {
    if (el.id === 'gr-size') S.settings.gr.size = +el.value; else S.settings.gr.newMax = +el.value;
    await saveSettings(); render();
    const d = document.querySelector('#app details'); if (d) d.open = true;
  }
  else if (el.id === 'fc-size' || el.id === 'fc-new' || el.id === 'fc-dir' || el.id === 'fc-verbs') {
    const fc = S.settings.fc;
    if (el.id === 'fc-size') fc.size = +el.value;
    else if (el.id === 'fc-new') fc.newMax = +el.value;
    else if (el.id === 'fc-dir') fc.dir = el.value;
    else fc.verbs = el.value === '1';
    await saveSettings();
    render();
    const d = document.querySelector('#app details'); if (d) d.open = true;
  }
  else if (el.id === 'bestand' && el.files.length) {
    S.msg = null;
    S.plan = await planImport(Array.from(el.files));
    render();
  }
  else if (el.id === 'terug' && el.files.length) restoreBackup(el.files[0]);
});
document.addEventListener('keydown', e => {
  if (S.view === 'spreek' && S.zn) {
    if (e.target && e.target.id === 'mr-input' && e.key === 'Enter') { e.preventDefault(); znCheck(); }
    else if (e.target === document.body && S.zn.feedback && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); S.zn.feedback = null; render(); }
    return;
  }
  if (S.view === 'werkwoord' && S.wt) {
    if (e.target && e.target.id === 'mr-input' && e.key === 'Enter') { e.preventDefault(); wtCheck(); }
    else if (e.target === document.body && S.wt.feedback && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); S.wt.feedback = null; render(); }
    return;
  }
  if (S.view === 'overeen' && S.ov && e.target === document.body) {
    if (S.ov.feedback) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); S.ov.feedback = null; render(); } }
    else if (S.ov.sess.queue.length && /^[1-4]$/.test(e.key)) {
      const q = S.ov.sess.queue[0].q; const o = q && q.options[+e.key - 1]; if (o) ovPick(o);
    }
    return;
  }
  if (S.view === 'meervoud' && S.mr) {
    if (e.target && e.target.id === 'mr-input' && e.key === 'Enter') { e.preventDefault(); mrCheck(); }
    else if (e.target === document.body && S.mr.feedback && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); S.mr.feedback = null; render(); }
    return;
  }
  if (S.view === 'genus' && S.gr && e.target === document.body) {
    if (S.gr.feedback) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); S.gr.feedback = null; render(); } }
    else if (S.gr.sess.queue.length) {
      if (e.key === '1' || e.key === 'e' || e.key === 'ArrowLeft') grPick('el');
      else if (e.key === '2' || e.key === 'l' || e.key === 'ArrowRight') grPick('la');
    }
    return;
  }
  if (S.view !== 'flash' || !S.fc || e.target !== document.body) return;
  if ((e.key === ' ' || e.key === 'Enter') && !S.fc.revealed) { e.preventDefault(); S.fc.revealed = true; render(); }
  else if (S.fc.revealed && (e.key === 'ArrowRight' || e.key === '2')) fcAnswer(true);
  else if (S.fc.revealed && (e.key === 'ArrowLeft' || e.key === '1')) fcAnswer(false);
});
document.addEventListener('input', e => {
  if (e.target.id === 'zoek') {
    S.search = e.target.value; S.limit = 150;
    const pos = e.target.selectionStart; render();
    const z = $('#zoek'); if (z) { z.focus(); try { z.setSelectionRange(pos, pos); } catch (_) {} }
  }
});

// Offline-werking: alleen via https of localhost; mislukt het, dan werkt de app gewoon online.
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

(async function start() {
  await store.init();
  try { if (navigator.storage && navigator.storage.persist) S.persisted = await navigator.storage.persist(); } catch (_) {}
  await loadAll();
  render();
})();

</script>
